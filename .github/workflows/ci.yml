name: Runtime boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify public boundary and Maven publications
        run: ./gradlew check publishAllPublicationsToProjectLocalRepository --no-daemon

      - name: Verify release and Maven Central boundaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
